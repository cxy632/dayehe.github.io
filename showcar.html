<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEAN3D Clone - 3D Model Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: Arial, sans-serif; }
  #canvas-container { width: 100%; height: 100%; position: relative; }

  /* Top bar */
  .top-bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px;
    background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
    pointer-events: none;
  }
  .top-bar > * { pointer-events: auto; }
  .logo {
    display: flex; align-items: center; gap: 8px;
    text-decoration: none; color: #fff;
  }
  .logo img { height: 32px; }
  .logo span { font-size: 18px; font-weight: bold; letter-spacing: 2px; }

  .back-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 16px; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px;
    background: rgba(0,0,0,0.4); color: #fff; cursor: pointer;
    font-size: 14px; backdrop-filter: blur(10px);
    transition: all 0.3s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.5); }
  .back-btn svg { width: 16px; height: 16px; }

  /* Bottom bar */
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center; gap: 16px;
    padding: 16px 24px 24px;
    background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
    pointer-events: none;
  }
  .bottom-bar > * { pointer-events: auto; }

  .control-btn {
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
    background: rgba(0,0,0,0.5); color: #fff; cursor: pointer;
    backdrop-filter: blur(10px); transition: all 0.3s;
  }
  .control-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }
  .control-btn.active { background: rgba(0,122,255,0.4); border-color: rgba(0,122,255,0.6); }
  .control-btn svg { width: 20px; height: 20px; }

  .view-badge {
    position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
    padding: 6px 16px; border-radius: 20px;
    background: rgba(0,0,0,0.5); color: #fff; font-size: 12px;
    backdrop-filter: blur(10px); z-index: 10;
    pointer-events: none; transition: all 0.3s;
  }

  /* Loading */
  .loading-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #111; z-index: 20; transition: opacity 0.5s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 48px; height: 48px; border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #007aff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: #aaa; margin-top: 16px; font-size: 14px; }

  /* Animation panel - right side */
  .anim-panel {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    z-index: 10; display: flex; flex-direction: column; gap: 8px;
    opacity: 0; pointer-events: none; transition: opacity 0.6s ease;
  }
  .anim-panel.visible { opacity: 1; pointer-events: auto; }
  .anim-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
    background: rgba(0,0,0,0.55); color: #fff; cursor: pointer;
    font-size: 13px; backdrop-filter: blur(10px);
    transition: all 0.3s; white-space: nowrap;
  }
  .anim-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.45); transform: scale(1.03); }
  .anim-btn:active { transform: scale(0.95); }
  .anim-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .anim-btn.explode { border-color: rgba(255,100,80,0.5); }
  .anim-btn.explode:hover { border-color: rgba(255,100,80,0.8); background: rgba(255,60,40,0.2); }
  .anim-btn.assemble { border-color: rgba(80,200,120,0.5); }
  .anim-btn.assemble:hover { border-color: rgba(80,200,120,0.8); background: rgba(40,180,80,0.2); }
  .anim-btn.wheel { border-color: rgba(100,160,255,0.5); }
  .anim-btn.wheel:hover { border-color: rgba(100,160,255,0.8); background: rgba(40,100,255,0.2); }
  .anim-btn.bounce { border-color: rgba(220,180,60,0.5); }
  .anim-btn.bounce:hover { border-color: rgba(220,180,60,0.8); background: rgba(200,150,20,0.2); }

  .part-count-badge {
    position: absolute; bottom: 95px; right: 24px; z-index: 10;
    padding: 4px 12px; border-radius: 14px;
    background: rgba(0,0,0,0.5); color: #aaa; font-size: 11px;
    backdrop-filter: blur(10px); pointer-events: none;
    opacity: 0; transition: opacity 0.5s;
  }
  .part-count-badge.visible { opacity: 1; }

  /* Responsive */
  @media (max-width: 768px) {
    .top-bar { padding: 10px 16px; }
    .logo span { font-size: 14px; }
    .bottom-bar { gap: 12px; padding: 12px 16px 20px; }
    .control-btn { width: 38px; height: 38px; }
    .control-btn svg { width: 17px; height: 17px; }
    .anim-panel { right: 4px; gap: 4px; }
    .anim-btn { padding: 8px 10px; font-size: 11px; }
    .anim-btn svg { width: 14px; height: 14px; }
  }
</style>
</head>
<body>

<div id="canvas-container">
  <!-- Top Bar -->
  <div class="top-bar">
    <a href="https://www.zean3d.com" class="logo" target="_blank">
      <!-- <img src="https://www.zean3d.com/assets/images/logo.png" alt="ZEAN3D"> -->
      <!-- <span>ZEAN3D</span> -->
    </a>
    <button class="back-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      返回
    </button>
  </div>

  <!-- Loading -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">正在加载模型...</div>
  </div>

  <!-- View badge -->
  <div class="view-badge" id="view-badge">360° 旋转查看</div>

  <!-- Animation Panel - right side -->
  <div class="anim-panel" id="anim-panel">
    <button class="anim-btn explode" id="btn-explode" title="爆炸分解视图">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="22"/><line x1="2" y1="12" x2="8" y2="12"/><line x1="16" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="8.5" y2="8.5"/><line x1="15.5" y1="15.5" x2="19.07" y2="19.07"/><line x1="19.07" y1="4.93" x2="15.5" y2="8.5"/><line x1="8.5" y1="15.5" x2="4.93" y2="19.07"/></svg>
      爆炸分解
    </button>
    <button class="anim-btn assemble" id="btn-assemble" title="组装动画">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      组装还原
    </button>
    <button class="anim-btn wheel" id="btn-wheel-spin" title="车轮旋转">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20"/><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
      轮毂旋转
    </button>
    <button class="anim-btn bounce" id="btn-bounce" title="悬挂弹跳">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 16 17"/><polyline points="8 12 10 14 12 12"/></svg>
      悬挂弹跳
    </button>
  </div>

  <!-- Part count badge -->
  <div class="part-count-badge" id="part-badge">0 个部件</div>

  <!-- Bottom Controls -->
  <div class="bottom-bar">
    <button class="control-btn" id="btn-zoom-in" title="放大">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="control-btn" id="btn-zoom-out" title="缩小">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="control-btn" id="btn-reset" title="重置视角">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
    </button>
    <button class="control-btn active" id="btn-auto-rotate" title="自动旋转">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </button>
    <button class="control-btn" id="btn-fullscreen" title="全屏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    </button>
  </div>
</div>

<!-- Anime.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>

<!-- Three.js CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ─── DOM elements ───
const container = document.getElementById('canvas-container');
const loadingOverlay = document.getElementById('loading');
const loadingText = document.getElementById('loading-text');
const viewBadge = document.getElementById('view-badge');
const animPanel = document.getElementById('anim-panel');
const partBadge = document.getElementById('part-badge');

// ─── Parts data storage ───
const partData = []; // { object, name, originalPos: {x,y,z}, originalScale: {x,y,z}, category }

// ─── Category keywords for part detection ───
const CATEGORIES = {
  wheel: ['wheel', 'tire', 'tyre', 'rim', 'hub', 'brake', 'disc', 'rotor', 'caliper', 'spoke', '轮', '胎', '毂'],
  engine: ['engine', 'motor', 'cylinder', 'piston', 'crank', 'exhaust', 'pipe', 'muffler', 'header', 'catalytic', '发动', '引擎', '排'],
  frame: ['frame', 'chassis', 'body', 'tank', 'fuel', 'seat', 'fairing', 'cowl', 'fender', 'mudguard', 'swingarm', 'fork', '车架', '车身', '座'],
  suspension: ['shock', 'spring', 'damper', 'suspension', 'strut', '避震', '悬挂', '弹簧'],
  cockpit: ['handlebar', 'bar', 'grip', 'lever', 'mirror', 'dashboard', 'meter', 'gauge', 'headlight', 'light', 'taillight', 'indicator', '把手', '仪表', '灯'],
  other: []
};

function categorizePart(name) {
  const lower = name.toLowerCase();
  for (const [category, keywords] of Object.entries(CATEGORIES)) {
    if (category === 'other') continue;
    for (const kw of keywords) {
      if (lower.includes(kw)) return category;
    }
  }
  return 'other';
}

// ─── Fly-in animation offsets per category ───
function getExplodeOffset(category, index, total) {
  const spread = 2.5;
  const angle = (index / Math.max(total, 1)) * Math.PI * 2;
  switch(category) {
    case 'wheel': return { x: Math.cos(angle) * spread * 1.2, y: -0.3 - index * 0.15, z: Math.sin(angle) * spread * 0.3 };
    case 'engine': return { x: Math.cos(angle) * spread * 0.8, y: 0.5 + index * 0.1, z: Math.sin(angle) * spread * 0.5 };
    case 'frame': return { x: Math.cos(angle + 0.5) * spread * 0.6, y: 0.8 + index * 0.08, z: Math.sin(angle + 0.5) * spread * 0.6 };
    case 'suspension': return { x: Math.cos(angle) * spread * 1.5, y: index * 0.2, z: Math.sin(angle) * spread * 1.0 };
    case 'cockpit': return { x: Math.cos(angle) * spread * 1.3, y: 1.2 + index * 0.1, z: Math.sin(angle) * spread * 0.4 };
    default: return { x: Math.cos(angle) * spread * 1.1, y: 1.0 + index * 0.12, z: Math.sin(angle) * spread * 0.9 };
  }
}

// ─── Scene setup ───
const scene = new THREE.Scene();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const pmremGenerator = new THREE.PMREMGenerator(renderer);
pmremGenerator.compileCubemapShader();

const roomEnv = new RoomEnvironment();
const envMap = pmremGenerator.fromScene(roomEnv).texture;
scene.environment = envMap;

const bgColor = new THREE.Color(0x1a1a2e);
scene.background = bgColor;
scene.fog = new THREE.Fog(0x1a1a2e, 5, 30);

// ─── Lighting ───
scene.add(new THREE.AmbientLight(0xffffff, 1.5));

const keyLight = new THREE.DirectionalLight(0xffffff, 3);
keyLight.position.set(5, 8, 5);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x8888ff, 1.5);
fillLight.position.set(-5, 3, -3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xff8888, 2);
rimLight.position.set(0, -2, -5);
scene.add(rimLight);

scene.add(new THREE.DirectionalLight(0xffffff, 1).translateY(10));

// ─── Ground ───
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.ShadowMaterial({ opacity: 0.15 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.5;
ground.receiveShadow = true;
scene.add(ground);

// ─── Camera ───
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4, 2, 5);
camera.lookAt(0, 0.3, 0);

// ─── Controls ───
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.7;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.5;
controls.update();

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ─── Parse URL params ───
const urlParams = new URLSearchParams(window.location.search);
const modelUrl = urlParams.get('model') || 'https://open.zean3d.com/v2/showroom/BMW_M-1000-RR-2021.glb';
const modelType = urlParams.get('type') || 'motorcycle';

loadingText.textContent = `正在加载 ${modelType === 'motorcycle' ? '摩托车' : modelType} 模型...`;

// ─── Loaders ───
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

// ─── Load model ───
let modelGroup = null;
let isExploded = false;
let activeAnimations = [];

loader.load(
  modelUrl,
  (gltf) => {
    modelGroup = gltf.scene;

    const box = new THREE.Box3().setFromObject(modelGroup);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 3 / maxDim;

    modelGroup.scale.setScalar(scale);
    modelGroup.position.set(-center.x * scale, -center.y * scale + 0.2, -center.z * scale);

    modelGroup.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        if (child.material) {
          const materials = Array.isArray(child.material) ? child.material : [child.material];
          materials.forEach(mat => {
            mat.roughness = mat.roughness || 0.4;
            mat.metalness = mat.metalness || 0.6;
          });
        }
      }
    });

    scene.add(modelGroup);

    // ─── Collect individual mesh parts ───
    const allMeshes = [];
    modelGroup.traverse((child) => {
      if (child.isMesh && child.parent) {
        allMeshes.push(child);
      }
    });

    // Build partData from meshes with recognizable names
    allMeshes.forEach((mesh, i) => {
      const name = mesh.name || mesh.parent?.name || `Part_${i}`;
      const category = categorizePart(name);
      partData.push({
        object: mesh,
        name: name,
        originalPos: mesh.position.clone(),
        originalScale: mesh.scale.clone(),
        category: category
      });
    });

    // Show animation panel and badge
    animPanel.classList.add('visible');
    partBadge.textContent = `${partData.length} 个部件`;
    partBadge.classList.add('visible');

    // Log breakdown
    const catCount = {};
    partData.forEach(p => { catCount[p.category] = (catCount[p.category] || 0) + 1; });
    console.log('Parts categorized:', catCount);
    console.log('Part data collected:', partData.map(p => `${p.name} [${p.category}]`));

    loadingOverlay.classList.add('hidden');
    setTimeout(() => loadingOverlay.style.display = 'none', 500);
    console.log('Model loaded:', modelUrl);
  },
  (progress) => {
    if (progress.total > 0) {
      loadingText.textContent = `加载中... ${Math.round((progress.loaded / progress.total) * 100)}%`;
    }
  },
  (error) => {
    console.error('Load error:', error);
    loadingText.textContent = '模型加载失败，尝试备用方式...';
    const fallback = new GLTFLoader();
    fallback.load(modelUrl, (gltf) => {
      modelGroup = gltf.scene;
      const box = new THREE.Box3().setFromObject(modelGroup);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const s = 3 / Math.max(size.x, size.y, size.z);
      modelGroup.scale.setScalar(s);
      modelGroup.position.set(-center.x * s, -center.y * s + 0.2, -center.z * s);
      scene.add(modelGroup);

      const allMeshes = [];
      modelGroup.traverse(c => { if (c.isMesh) allMeshes.push(c); });
      allMeshes.forEach((mesh, i) => {
        const name = mesh.name || `Part_${i}`;
        partData.push({
          object: mesh,
          name: name,
          originalPos: mesh.position.clone(),
          originalScale: mesh.scale.clone(),
          category: categorizePart(name)
        });
      });
      animPanel.classList.add('visible');
      partBadge.textContent = `${partData.length} 个部件`;
      partBadge.classList.add('visible');
      loadingOverlay.classList.add('hidden');
      setTimeout(() => loadingOverlay.style.display = 'none', 500);
    }, null, () => {
      loadingText.textContent = '模型加载失败，请稍后重试';
    });
  }
);

// ─── Animation loop ───
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ──────── anime.js Powered Part Animations ────────

function killAnimations() {
  activeAnimations.forEach(a => { try { a.pause(); } catch(e){} });
  activeAnimations = [];
}

// ─── EXPLODE: parts fly outward from center ───
document.getElementById('btn-explode').addEventListener('click', () => {
  if (!partData.length || isExploded) return;
  killAnimations();
  isExploded = true;
  viewBadge.textContent = '💥 爆炸分解视图';

  partData.forEach((part, i) => {
    const offset = getExplodeOffset(part.category, i, partData.length);

    // Animate position
    activeAnimations.push(anime({
      targets: part.object.position,
      x: part.originalPos.x + offset.x,
      y: part.originalPos.y + offset.y,
      z: part.originalPos.z + offset.z,
      duration: 1200,
      delay: i * 8,
      easing: 'easeOutElastic(1, .5)',
      complete: () => { if (i === partData.length - 1) activeAnimations = []; }
    }));

    // Fade/scale animation on opacity via material
    // Small pause on auto-rotate during explode
  });

  controls.autoRotate = false;
  document.getElementById('btn-auto-rotate').classList.remove('active');

  setTimeout(() => { viewBadge.textContent = '💥 爆炸分解视图'; }, 2000);
});

// ─── ASSEMBLE: parts fly back to original positions ───
document.getElementById('btn-assemble').addEventListener('click', () => {
  if (!partData.length || !isExploded) return;
  killAnimations();
  isExploded = false;
  viewBadge.textContent = '🔧 组装还原中...';

  partData.forEach((part, i) => {
    activeAnimations.push(anime({
      targets: part.object.position,
      x: part.originalPos.x,
      y: part.originalPos.y,
      z: part.originalPos.z,
      duration: 1000,
      delay: i * 6,
      easing: 'easeInOutQuad',
      complete: () => { if (i === partData.length - 1) activeAnimations = []; }
    }));
  });

  setTimeout(() => {
    viewBadge.textContent = '360° 旋转查看';
    controls.autoRotate = true;
    document.getElementById('btn-auto-rotate').classList.add('active');
  }, 1500);
});

// ─── WHEEL SPIN: rotate wheel parts ───
document.getElementById('btn-wheel-spin').addEventListener('click', () => {
  if (!partData.length) return;
  killAnimations();
  viewBadge.textContent = '🔄 轮毂旋转中...';

  const wheelParts = partData.filter(p => p.category === 'wheel');
  if (wheelParts.length === 0) {
    viewBadge.textContent = '未检测到车轮部件';
    setTimeout(() => { viewBadge.textContent = '360° 旋转查看'; }, 2000);
    return;
  }

  // If exploded, first assemble, then spin
  if (isExploded) {
    partData.forEach((part, i) => {
      anime({
        targets: part.object.position,
        x: part.originalPos.x,
        y: part.originalPos.y,
        z: part.originalPos.z,
        duration: 600,
        delay: i * 3,
        easing: 'easeOutQuad'
      });
    });
    isExploded = false;
    setTimeout(() => doWheelSpin(wheelParts), 700);
  } else {
    doWheelSpin(wheelParts);
  }

  function doWheelSpin(wheelParts) {
    // Spin wheel parts continuously for a few seconds, then slow down
    wheelParts.forEach((part, i) => {
      // Create a proxy object for rotation
      const rotProxy = { y: 0 };

      // Spin phase
      const spinAnim = anime({
        targets: rotProxy,
        y: Math.PI * 6,
        duration: 2000,
        delay: i * 50,
        easing: 'easeInOutQuad',
        update: () => {
          part.object.rotation.z = rotProxy.y;
          // Also twist slightly for visual flair
          part.object.rotation.x = Math.sin(rotProxy.y * 0.5) * 0.15;
        },
        complete: () => {
          // Slow down and stop
          anime({
            targets: rotProxy,
            y: 0,
            duration: 800,
            easing: 'easeOutCubic',
            update: () => {
              part.object.rotation.z = rotProxy.y;
              part.object.rotation.x = Math.sin(rotProxy.y * 0.5) * 0.15;
            },
            complete: () => {
              part.object.rotation.set(0, 0, 0);
            }
          });
        }
      });
      activeAnimations.push(spinAnim);
    });

    setTimeout(() => {
      viewBadge.textContent = '360° 旋转查看';
    }, 3200);
  }
});

// ─── BOUNCE: suspension / whole model bounce ───
document.getElementById('btn-bounce').addEventListener('click', () => {
  if (!partData.length) return;
  killAnimations();
  viewBadge.textContent = '🏍️ 悬挂弹跳中...';

  const susParts = partData.filter(p => p.category === 'suspension');
  const bounceTargets = susParts.length > 0 ? susParts : partData;

  // Bounce sequence using anime timeline
  bounceTargets.forEach((part, i) => {
    const origY = part.object.position.y;
    const tl = anime.timeline({
      easing: 'easeInOutQuad',
      delay: i * 20
    });

    // Bounce up and down with decreasing amplitude
    const bounces = [
      { dy: 0.35, dur: 300 },
      { dy: -0.25, dur: 250 },
      { dy: 0.18, dur: 220 },
      { dy: -0.12, dur: 200 },
      { dy: 0.06, dur: 180 },
      { dy: -0.03, dur: 150 },
      { dy: 0.0, dur: 200 }
    ];

    bounces.forEach(b => {
      tl.add({
        targets: part.object.position,
        y: origY + b.dy,
        duration: b.dur,
        complete: () => {
          if (i === bounceTargets.length - 1 && b.dy === 0) {
            viewBadge.textContent = '360° 旋转查看';
          }
        }
      });
    });

    activeAnimations.push(tl);
  });
});

// ─── Button Controls ───
document.getElementById('btn-zoom-in').addEventListener('click', () => {
  const dir = camera.position.clone().sub(controls.target).normalize();
  if (camera.position.distanceTo(controls.target) > controls.minDistance + 0.5) {
    camera.position.addScaledVector(dir, -0.8);
  }
});

document.getElementById('btn-zoom-out').addEventListener('click', () => {
  const dir = camera.position.clone().sub(controls.target).normalize();
  if (camera.position.distanceTo(controls.target) < controls.maxDistance - 0.5) {
    camera.position.addScaledVector(dir, 0.8);
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  controls.target.set(0, 0.3, 0);
  camera.position.set(4, 2, 5);
  camera.lookAt(controls.target);
  controls.update();

  // Also assemble if exploded
  if (isExploded) {
    killAnimations();
    isExploded = false;
    partData.forEach(part => {
      part.object.position.copy(part.originalPos);
      part.object.rotation.set(0, 0, 0);
    });
  }

  viewBadge.textContent = '视角已重置';
  setTimeout(() => { viewBadge.textContent = '360° 旋转查看'; }, 1500);
});

const btnAutoRotate = document.getElementById('btn-auto-rotate');
btnAutoRotate.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnAutoRotate.classList.toggle('active', controls.autoRotate);
  viewBadge.textContent = controls.autoRotate ? '360° 自动旋转' : '手动旋转模式';
  setTimeout(() => { viewBadge.textContent = controls.autoRotate ? '360° 旋转查看' : '拖拽查看'; }, 1500);
});

document.getElementById('btn-fullscreen').addEventListener('click', () => {
  document.fullscreenElement ? document.exitFullscreen() : container.requestFullscreen();
});

// ─── Keyboard shortcuts ───
window.addEventListener('keydown', (e) => {
  switch(e.key.toLowerCase()) {
    case 'r': controls.autoRotate = !controls.autoRotate; btnAutoRotate.classList.toggle('active', controls.autoRotate); break;
    case 'f': container.requestFullscreen(); break;
    case 'escape': if(document.fullscreenElement) document.exitFullscreen(); break;
    case '0': controls.target.set(0, 0.3, 0); camera.position.set(4, 2, 5); controls.update(); break;
    case '+': case '=':
      camera.position.addScaledVector(camera.position.clone().sub(controls.target).normalize(), -0.5);
      break;
    case '-':
      camera.position.addScaledVector(camera.position.clone().sub(controls.target).normalize(), 0.5);
      break;
    case 'e':
      if (partData.length && !isExploded) document.getElementById('btn-explode').click();
      else if (isExploded) document.getElementById('btn-assemble').click();
      break;
    case 'w':
      if (partData.length) document.getElementById('btn-wheel-spin').click();
      break;
    case 'b':
      if (partData.length) document.getElementById('btn-bounce').click();
      break;
  }
});

// ─── Resize ───
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── Touch double-tap reset ───
let lastTap = 0;
container.addEventListener('touchend', () => {
  const now = Date.now();
  if (now - lastTap < 300) {
    controls.target.set(0, 0.3, 0);
    camera.position.set(4, 2, 5);
    controls.update();
    if (isExploded) {
      killAnimations();
      isExploded = false;
      partData.forEach(p => p.object.position.copy(p.originalPos));
    }
  }
  lastTap = now;
});

// ─── Mouse interaction tracking ───
container.addEventListener('pointerdown', () => {
  viewBadge.textContent = '拖拽旋转 · 滚轮缩放';
});
container.addEventListener('pointerup', () => {
  setTimeout(() => {
    if (!isExploded) {
      viewBadge.textContent = controls.autoRotate ? '360° 旋转查看' : '拖拽查看';
    }
  }, 2000);
});

console.log('Model URL:', modelUrl);
console.log('Type:', modelType);
console.log('Keyboard shortcuts: E=Explode/Assemble, W=Wheel spin, B=Bounce, R=Auto-rotate, F=Fullscreen, 0=Reset');
